<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Xsta</title>
    <style id="expo-reset">
      /* 레이아웃: 화면 하나짜리 앱. 넓은 화면에서는 가운데 폰 틀, 바깥은 은은한 보라 배경 */
      :root { --page: #E9E6F5; }
      @media (prefers-color-scheme: dark) { :root { --page: #07060C; color-scheme: dark; } }
      html, body { height: 100%; }
      body { margin: 0; overflow: hidden; background: var(--page); }
      #root { display: flex; flex: 1; height: 100%; box-sizing: border-box; padding-inline: 16px; padding-block: 12px; }
    </style>
  </head>
  <body>
    <noscript>자바스크립트를 켜야 앱이 실행돼요.</noscript>
    <div id="root"></div>
  </body>
</html>
